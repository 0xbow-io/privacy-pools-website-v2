name: Dependency audit

# Fails when the production dependency tree has a high or critical advisory.
# Exceptions live in .bun-audit-ignore and are explained in docs/dependency-audit.md. Add one only
# with a written reason.

on:
  pull_request:
  push:
    branches: [main, dev]
  schedule:
    # New advisories land without any change in this repo, so re-check weekly.
    - cron: '53 6 * * 1'

permissions:
  contents: read

jobs:
  audit:
    name: Audit production dependencies (high and critical)
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit so a moved tag cannot change what a security gate runs.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      # bun audit reads bun.lock, so no install is needed.
      - name: Audit
        run: |
          ignores=$(sed -E 's/#.*//; s/[[:space:]]+//g; /^$/d; s/^/--ignore=/' .bun-audit-ignore | tr '\n' ' ')
          bun audit --prod --audit-level=high $ignores
