name: Reproducible static release
on:
  # Releases created by GITHUB_TOKEN do not emit a new release/tag workflow event.
  workflow_run:
    workflows: [tag-release]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published stable release tag to reproduce
        required: true
        type: string
permissions:
  contents: write
concurrency:
  group: reproducible-static-release
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository_owner == '0xbow-io' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.workflow_run.head_sha || inputs.tag }}
          fetch-depth: 0
          lfs: true
          persist-credentials: false
      - name: Verify release identity and main ancestry
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./package.json').version")
          tag="v$version"
          if [ -n "$REQUESTED_TAG" ] && [ "$REQUESTED_TAG" != "$tag" ]; then exit 1; fi
          if ! git rev-parse --verify "refs/tags/$tag" >/dev/null 2>&1; then
            echo 'No release tag for this push'
            exit 0
          fi
          if [ "$(git rev-parse "$tag^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo 'This push did not create the release tag'
            exit 0
          fi
          git merge-base --is-ancestor HEAD origin/main
          gh release view "$tag" --json isDraft,isPrerelease --jq 'if .isDraft or .isPrerelease then error("not stable") else . end'
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Build twice with pinned tools and bundled circuits
        if: steps.release.outputs.tag != ''
        run: node scripts/release/reproducible.mjs
      - name: Publish verified bundle, CAR, hashes and CIDs
        if: steps.release.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: node scripts/release/publish-static.mjs
