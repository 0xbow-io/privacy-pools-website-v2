<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
{{fonts}}
* { box-sizing: border-box; }
body { margin: 0; font-family: Geist,sans-serif; -webkit-font-smoothing: antialiased; }
article { position: relative; width: 1200px; height: 630px; overflow: hidden; background: #fff; color: #161616; }
h1,p { margin: 0; }
img { display: block; }
h1 { position: absolute; font-weight: 500; letter-spacing: -3px; line-height: 1.08; font-size: 76px; }
.sub { position: absolute; font-size: 24px; line-height: 1.45; color: #666; letter-spacing: -.5px; }
.scene { background: var(--bg); color: var(--ink); border-radius: 24px; }
.blue { --bg: #e4edff; --ink: #205bea; --edge: #ceddff; }
.purple { --bg: #ece3ff; --ink: #8050d4; --edge: #dcccf5; }
.green { --bg: #def3e9; --ink: #19865e; --edge: #c4e6d5; }
.copy { position: absolute; left: 56px; top: 186px; width: 550px; display: flex; flex-direction: column; align-items: flex-start; }
.copy h1 { position: static; margin-top: 0; font-size: 92px; letter-spacing: -4px; line-height: 1.08; white-space: nowrap; }
.copy .sub { position: static; margin-top: 40px; font-size: 50px; line-height: 1.22; letter-spacing: -1.4px; color: #454545; white-space: nowrap; }
.words { position: absolute; left: 650px; top: 74px; right: 56px; display: flex; flex-direction: column; gap: 16px; }
.word { height: 150px; padding: 12px 20px 12px 28px; display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 35px; letter-spacing: -1.3px; font-weight: 500; padding-left: 24px; }
.action-detail { position: relative; width: 198px; height: 126px; flex: none; background: #fff; border: 1px solid var(--edge); border-radius: 20px; padding: 13px 17px; box-shadow: 0 3px 5px #17264503,0 10px 20px #17264509; font-size: 19px; letter-spacing: -.4px; overflow: hidden; }
.swap { padding: 9px; display: flex; flex-direction: column; gap: 6px; }
.swap-field { height: 50px; border-radius: 12px; background: var(--bg); display: flex; align-items: center; justify-content: space-between; padding: 0 13px; }
.swap-field span { font-size: 21px; font-weight: 500; }
.swap-connector { position: absolute; left: 84px; top: 48px; display: grid; place-items: center; width: 30px; height: 30px; border: 3px solid #fff; border-radius: 10px; background: var(--bg); }
.swap-connector svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.earned-label { font-size: 18px; letter-spacing: -.2px; line-height: 23px; }
.earned-value { font-size: 36px; line-height: 43px; font-weight: 500; letter-spacing: -1.5px; }
.earned-value span { font-size: 18px; letter-spacing: -.3px; }
.earned-chart { display: block; width: 164px; height: 25px; margin-top: 4px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .65; }
.asset-icon { width: 34px; height: 34px; flex: none; }
.send { padding: 14px; }
.send-amount { height: 39px; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 29px; font-weight: 500; letter-spacing: -.8px; }
.send-amount span { font-size: 19px; letter-spacing: -.3px; }
.send-button { display: flex; align-items: center; justify-content: center; gap: 14px; height: 42px; margin-top: 12px; background: var(--ink); color: white; border-radius: 12px; font-size: 20px; font-weight: 500; letter-spacing: -.4px; }
.send-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
/* Square placements reflow the same content rather than cropping the hero. */
article.square { height: 1200px; }
.square .copy { top: 120px; left: 80px; width: 1040px; }
.square .words { top: 490px; left: 80px; right: 80px; gap: 20px; }
.square .word { height: 180px; font-size: 48px; padding: 20px 32px; }

</style>
</head>
<body>
<article><div class="copy"><h1>{{headline}}</h1><p class="sub">{{support}}</p></div><div class="words"><div class="scene blue word"><span>Swapping.</span><div class="action-detail swap" aria-hidden="true"><div class="swap-field"><svg class="asset-icon" viewBox="0 0 32 32" fill="none">
      <circle cx="16" cy="16" r="16" fill="#3E73C4" />

      <path d="M12.892 24.497c-4.754-1.7-7.192-6.98-5.424-11.653.914-2.55 2.925-4.491 5.424-5.402.244-.121.365-.303.365-.607v-.85c0-.242-.121-.424-.365-.485-.061 0-.183 0-.244.06a10.895 10.895 0 00-7.13 13.717c1.096 3.4 3.717 6.01 7.13 7.102.244.121.488 0 .548-.243.061-.06.061-.122.061-.243v-.85c0-.182-.182-.424-.365-.546zm6.46-18.936c-.244-.122-.488 0-.548.242-.061.061-.061.122-.061.243v.85c0 .243.182.485.365.607 4.754 1.7 7.192 6.98 5.424 11.653-.914 2.55-2.925 4.491-5.424 5.402-.244.121-.365.303-.365.607v.85c0 .242.121.424.365.485.061 0 .183 0 .244-.06a10.895 10.895 0 007.13-13.717c-1.096-3.46-3.778-6.07-7.13-7.162z" fill="#FFF" />
    </svg><span>USDC</span></div><span class="swap-connector"><svg viewBox="0 0 24 24"><path d="M12 4v16m-6-6 6 6 6-6"/></svg></span><div class="swap-field"><svg class="asset-icon" viewBox="0 0 20 20" fill="none">
      <circle cx="10" cy="10" r="10" fill="#627EEA" />
      <path d="M10 4L10 8.5L13.5 10L10 4Z" fill="#C0CBF6" />
      <path d="M10 4L6.5 10L10 8.5L10 4Z" fill="white" />
      <path d="M10 12.5L10 16L13.5 10.75L10 12.5Z" fill="#C0CBF6" />
      <path d="M10 16L10 12.5L6.5 10.75L10 16Z" fill="white" />
      <path d="M10 11.75L13.5 10L10 8.5L10 11.75Z" fill="#8197EE" />
      <path d="M6.5 10L10 11.75L10 8.5L6.5 10Z" fill="#C0CBF6" />
    </svg><span>ETH</span></div></div></div><div class="scene green word"><span>Earning yield.</span><div class="action-detail earn" aria-hidden="true"><div class="earned-label">Yield earned</div><div class="earned-value">+24 <span>USDC</span></div><svg class="earned-chart" viewBox="0 0 164 28"><path d="M2 25 25 24 47 20 69 22 93 14 114 15 139 7 162 3"/></svg></div></div><div class="scene purple word"><span>Sending.</span><div class="action-detail send" aria-hidden="true"><div class="send-amount">100 <span>USDC</span></div><div class="send-button">Send<svg viewBox="0 0 24 24"><path d="M5 19 19 5M6 5h13v13"/></svg></div></div></div></div></article>
</body>
</html>
